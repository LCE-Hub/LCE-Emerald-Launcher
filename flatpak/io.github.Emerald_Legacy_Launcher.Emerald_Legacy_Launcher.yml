app-id: io.github.Emerald_Legacy_Launcher.Emerald_Legacy_Launcher
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: emerald-legacy-launcher
finish-args:
  - --share=network
  - --share=ipc
  - --device=input
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-data
  - --filesystem=xdg-run/pipewire-0
modules:
  - name: SDL3
    buildsystem: cmake-ninja
    config-opts:
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.2.30
        commit: f5e5f6588921eed3d7d048ce43d9eb1ff0da0ffc
  - name: SDL3_ttf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDLTTF_VENDORED=ON
      - -DSDLTTF_PLUTOSVG=OFF
      - -DSDLTTF_EXAMPLES=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_ttf.git
        tag: release-3.2.2
        commit: a1ce3670aec736ecbf0936c43f2f0cc53aa61e5b
  - name: pugixml
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/zeux/pugixml.git
        tag: v1.15
        commit: ee86beb30e4973f5feffe3ce63bfa4fbadf72f38
  - name: emerald-legacy-launcher
    buildsystem: cmake-ninja
    build-options:
      build-args:
        - --share=network
    post-install:
      - install -Dm644 flatpak/io.github.Emerald_Legacy_Launcher.Emerald_Legacy_Launcher.desktop /app/share/applications/io.github.Emerald_Legacy_Launcher.Emerald_Legacy_Launcher.desktop
      - install -Dm644 flatpak/io.github.Emerald_Legacy_Launcher.Emerald_Legacy_Launcher.metainfo.xml /app/share/metainfo/io.github.Emerald_Legacy_Launcher.Emerald_Legacy_Launcher.metainfo.xml
      - install -Dm644 public/images/icon.png /app/share/icons/hicolor/512x512/apps/io.github.Emerald_Legacy_Launcher.Emerald_Legacy_Launcher.png
    sources:
      - type: dir
        path: ..
        skip:
          - DiamondRuntime
          - GoldMapper
          - old
          - build
          - android_extras
          - .cache
          - .git
          - .flatpak-builder
          - emerald-repo
          - build-flatpak
          - emerald.flatpak
